<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;width:100%;height:100%;font-family:'Inter',sans-serif;color:var(--t96);">
  <div style="display:flex;align-items:center;gap:18px;margin-bottom:14px;font-size:12px;color:var(--t60);">
    <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:3px;background:oklch(0.6 0.22 350);"></div>RM &nbsp; Jualan Sebenar <span style="font-style:italic;">/ Actual Sales</span></div>
    <div style="display:flex;align-items:center;gap:6px;"><div style="width:10px;height:10px;border-radius:50%;background:oklch(0.78 0.12 85);"></div>Sasaran <span style="font-style:italic;">/ Target</span></div>
  </div>
  <div style="flex:1;display:flex;gap:10px;min-height:0;">
    <div style="display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--t50);padding:6px 0;">
      <span>{{ maxLabel }}</span><span>{{ threeQLabel }}</span><span>{{ halfLabel }}</span><span>{{ quarterLabel }}</span><span>0</span>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:flex-end;gap:14px;border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:6px 10px 0;">
      <svg viewBox="0 0 1180 380" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;">
        <polyline points="{{ linePoints }}" fill="none" stroke="oklch(0.78 0.12 85)" stroke-width="2.5"></polyline>
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="12">
          <circle cx="{{ d.x }}" cy="{{ d.y }}" r="4.5" fill="var(--input-bg)" stroke="oklch(0.78 0.12 85)" stroke-width="2"></circle>
        </sc-for>
      </svg>
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
        <div style="flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1;">
          <sc-if value="{{ b.hasValue }}">
            <div title="{{ b.valueLabel }}" style="width:60%;border-radius:4px 4px 0 0;background:oklch(0.6 0.22 350);height:{{ b.pctHeight }};"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;gap:14px;padding:8px 10px 0 34px;">
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="12">
      <div style="flex:1;text-align:center;font-size:11px;color:var(--t55);">{{ b.label }}</div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:320}}">
class Component extends DCLogic {
  renderVals() {
    const chart = this.props.chart || { bars: [], dots: [], linePoints: '', maxLabel: '0' };
    const maxNum = parseInt(String(chart.maxLabel).replace(/,/g, '')) || 0;
    const fmt = (n) => Math.round(n).toLocaleString('en-US');
    return {
      bars: chart.bars, dots: chart.dots, linePoints: chart.linePoints, maxLabel: chart.maxLabel,
      threeQLabel: fmt(maxNum * 0.75), halfLabel: fmt(maxNum * 0.5), quarterLabel: fmt(maxNum * 0.25),
    };
  }
}
</script>
</body>
</html>
